; KIVFS – uzel node3 ze 3, VŠECHNY uzly na jednom stroji (vývoj, ladění)
;
; Vše na 127.0.0.1, proto má každý uzel vlastní rozsah portů:
;     node1 = 310xx, node2 = 311xx, node3 = 312xx
; a nodeN v [cluster] proto nese i port.
; Porty MUSÍ být pod 32768: od 32768 výš (Linux ip_local_port_range) jádro
; přiděluje zdrojové porty odchozím spojením – kdyby některé dostalo např.
; 32002 dřív, než ho modul otevře, modul skončí "Address already in use".

[cluster]
local = node3
node1 = 127.0.0.1:31002
node2 = 127.0.0.1:31102
node3 = 127.0.0.1:31202

[auth]
ip   = 127.0.0.1
port = 31201

[sync]
ip   = 127.0.0.1
port = 31202
max_pending = 256         ; zprávy čekající na jedno spojení k jinému Syncu
                          ; (souběžná kola + COMMIT/ABORT); výchozí 16 je málo

[vfs]
ip   = 127.0.0.1
port = 31203

[db]
ip   = 127.0.0.1
port = 31204

[fs]
ip   = 127.0.0.1
port = 31205

; KIVFS – uzel node2 ze 3, VŠECHNY uzly na jednom stroji (vývoj, ladění)
;
; Vše na 127.0.0.1, proto má každý uzel vlastní rozsah portů:
;     node1 = 310xx, node2 = 320xx, node3 = 330xx
; a nodeN v [cluster] proto nese i port.

[cluster]
local = node2
node1 = 127.0.0.1:31002
node2 = 127.0.0.1:32002
node3 = 127.0.0.1:33002

[auth]
ip   = 127.0.0.1
port = 32001

[sync]
ip   = 127.0.0.1
port = 32002

[vfs]
ip   = 127.0.0.1
port = 32003

[db]
ip   = 127.0.0.1
port = 32004

[fs]
ip   = 127.0.0.1
port = 32005

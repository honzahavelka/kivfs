; KIVFS – ukázka: uzel node1 rozdělený na víc strojů
;
; Proč má každý modul vlastní "ip": modul je samostatný proces a může
; běžet jinde (kap. 7.1 původní práce). Tady Auth + Sync + VFS běží na
; 10.0.0.11, databázový modul na 10.0.0.12 a FS na úložném serveru
; 10.0.0.13. Tento soubor se nakopíruje na všechny tři stroje.
;
; Ukázka i volitelných klíčů sekce modulu (viz server/core/modconf.h).

[cluster]
local = node1
node1 = 10.0.0.11
node2 = 10.0.1.11
node3 = 10.0.2.11

[auth]
ip        = 10.0.0.11
port      = 30001
max_conns = 1024          ; klientů může být hodně

[sync]
ip   = 10.0.0.11
port = 30002
connect_timeout_ms = 2000 ; ostatní uzly jsou přes WAN

[vfs]
ip   = 10.0.0.11
port = 30003

[db]
ip   = 10.0.0.12
port = 30004
bind = 10.0.0.12          ; naslouchat jen na vnitřní síti

[fs]
ip   = 10.0.0.13
port = 30005

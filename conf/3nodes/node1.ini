; KIVFS – uzel node1 ze 3 (šablona "3 stroje, na každém všech 5 modulů")
;
; Stejný soubor dostanou všechny moduly tohoto stroje:
;     kivfs-<modul> -c node1.ini
; Všechny uzly používají stejné porty, liší se jen adresa stroje
; (jako v konfiguraci původního KIVFS). Jména node1..node3 musí být
; přeložitelná: v Dockeru jména kontejnerů/služeb ve společné síti,
; na fyzických strojích /etc/hosts – nebo je nahraď IP adresami.

[cluster]
local = node1
node1 = node1              ; adresa Sync uzlu; port = [sync] port
node2 = node2
node3 = node3

[auth]
ip   = node1               ; adresa, na které modul najdou ostatní
port = 30001

[sync]
ip   = node1
port = 30002
max_pending = 256         ; zprávy čekající na jedno spojení k jinému Syncu
                          ; (souběžná kola + COMMIT/ABORT); výchozí 16 je málo

[vfs]
ip   = node1
port = 30003

[db]
ip   = node1
port = 30004

[fs]
ip   = node1
port = 30005

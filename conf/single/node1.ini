; KIVFS – cluster s JEDINÝM uzlem na jednom stroji (scénář fs-local, ruční zkoušení)
;
; Sync nemá komu posílat SYNC_PROPOSE, takže kolo hlasování proběhne
; okamžitě (T_final = vlastní návrh) – operace jdou přes pruh CLI stejně
; jako ve více uzlech, jen bez sítě mezi Synci.
; Porty jako local/node1.ini (310xx) – nespouštět současně s local/.

[cluster]
local = node1
node1 = 127.0.0.1:31002

[auth]
ip   = 127.0.0.1
port = 31001

[sync]
ip   = 127.0.0.1
port = 31002

[vfs]
ip   = 127.0.0.1
port = 31003

[db]
ip   = 127.0.0.1
port = 31004

[fs]
ip   = 127.0.0.1
port = 31005

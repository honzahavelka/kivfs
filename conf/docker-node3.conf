# KIVFS – uzel 3 v clusteru z docker-compose.yml.
# Každý uzel běží ve vlastním kontejneru, jméno služby (node1..3) je zároveň
# jméno hostitele v síti compose. Všechny uzly poslouchají na stejném portu
# 9000 (jako v původním KIVFS); z Macu jsou dostupné na 9001..9003.
# Soubory docker-node1..3.conf se liší JEN v [node] id.

[node]
id        = 3
workers   = 4
max_conns = 64

[nodes]
1 = node1:9000
2 = node2:9000
3 = node3:9000
